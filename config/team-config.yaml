# This file lives in the roles repo but contains project-specific config.
# Update this file when team members, projects, binaries, or tracked items change.

# ─── Organization ────────────────────────────────────────────────────────────

organization:
  name: "EvenPlay"
  product: "Skill Money Games"

# ─── JIRA ────────────────────────────────────────────────────────────────────

jira:
  url: https://smgames.atlassian.net
  email: andrew@evenplay.com
  credentials_path: "~/.config/jira/credentials"
  projects:
    - SMG
    - BO
    - KIOS

# ─── GitHub ──────────────────────────────────────────────────────────────────

