    description: "REPLICATE STUDY. Seven models, FIVE RUNS EACH, one contract.\n\nTHE POINT IS THE NOISE FLOOR, not a ranking. Two arms of the first bakeoff\ncascaded to the same model, claude-opus-5[1m], and ran the same task from the\nsame contract with the same brief. They produced 7 seals / 877 lines and 13\nseals / 1450 lines, and on the headline metric one killed the measured mutation\nand the other killed nothing. That is WITHIN-model variance, and it is larger\nthan most between-model comparisons report.\n\nSo before any routing rule: five runs of each model establish the spread you\nget from changing nothing. Only differences that EXCEED that spread mean\nanything. If Fable and Opus differ by less than Opus differs from itself, they\nare indistinguishable for this purpose and the honest answer is \"either\".\n\nNO PANEL. Scored only by features/model-matrix/scorecard.py — mutation kill\nrate over nine defects, gate state, cost, wall-clock. This removes the reviewer\nconfound entirely (one seat approved every arm of the first bakeoff, including\nwork a mutation test disproved) and makes the result reproducible by anyone\nwith the repo.\n\n--- THE BRIEF ---\n\nSeal GO-1-1's contract. The row that matters FAILS today and its exact\nmutation is already measured: `emit()`'s `ContractV2` arm rewritten to\n`EmitV1` must redden this file, and at `0cfdb57` it reddens nothing.\n\nCover the mapping, not the library: (contract x -out x -json) -> artifact\nset + exit code. Include `-contract-version 3` -> exit 3 with a message\nnaming the accepted set, and `-contract-version 2` producing the wrapper\non stdout.\n\nA LIVE VACUOUS SEAL IS IN SCOPE AND IS MEASURED.\n`TestSeal_InstalledDigestSource_YieldsHexOrErrors`\n(`capability_seal_test.go:409`) returns early on error having asserted\nnothing about the values. Proved rather than argued: running that test\nALONE under coverage gives `ConsumedDigests` 90.0% and `hexSHA256` 0.0% —\nthe hex/length/lowercase assertions below the early return never execute,\nbecause `ConsumedDigests` raises unless BOTH `sawConfig` and `sawDiff`\nare set, and no test in the package calls `readDiff`. Say whether it is\namended or struck.\n\nTWO CORRECTIONS TO THE RECORD, both making the unit SMALLER, both\nmeasured at `0cfdb57` and both to be re-derived rather than trusted:\n\n  1. \"Swapping the digests passes the suite\" NO LONGER REPRODUCES.\n     Rewriting `ConsumedDigests`' return from\n     `hexSHA256(s.config), hexSHA256(s.diff)` to the reverse reddens\n     EXACTLY ONE row —\n     `TestSeal_Repair_ResolveConfigDual_ConsumedBytesMustBeTheCertifiedBytes`,\n     added by a later repair wave. The swap is caught. Do not write a\n     row for a defect that is already sealed.\n  2. \"The production DigestSource success path never executes in any\n     test\" is CLOSED. Whole-suite coverage at `0cfdb57`: `recordConfig`\n     100.0%, `recordDiff` 100.0%, `ConsumedDigests` 100.0%, `hexSHA256`\n     100.0%. What remains is that ONE seal's own assertions are\n     unreachable — a narrower defect than the one recorded, and it is the\n     one to seal.\n\nNON-VACUITY: this module has already produced four measured vacuous\nseals. Do not seal that a function was CALLED; seal what it ANSWERED.\nProve each row red by the specific defect it names and carry an in-test\ncontrol judged in the same call."
