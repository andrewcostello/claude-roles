#       reproduce there either: measured 2026-08-12, evenplay-mono has 122
#       go.mod files, of which 119 require >= 1.25 (82 spell it `go 1.25.0`,
#       37 spell it `go 1.25`) and 3 declare `go 1.19`. The recorded "37" is
#       exactly the count of the second spelling, which is the likeliest source
#       of the error. The exposure is real and LARGER than recorded — it is
#       just not this repository's.
