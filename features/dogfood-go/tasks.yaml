          main.go:255  registerContractVersionFlag  0.0%
          main.go:263  run                          0.0%
          main.go:319  resolveConfigPath            0.0%
          main.go:382  persist                      0.0%
          main.go:461  emit                         0.0%

      SEVEN functions at 0.0%, not the four recorded. The whole entry spine
      from `main` to the artifact is unexecuted. Module coverage overall is
      58.3%, so this is not a project with no tests — it is a project whose
      tests all enter below the wiring. `readset.go:1109 run` is a DIFFERENT
      `run` at 93.3%, and the three `run(` call sites in the seal files are
      that one; the grep that finds them is not evidence about `main.go`.

      THE CONSEQUENCE, MUTATION-PROVED rather than argued. In the scratch copy
      `emit()`'s v2 arm was rewritten to answer with v1 bytes:

          case ContractV2:
      -           return EmitV2(os.Stdout, cls)
      +           return EmitV1(os.Stdout, cls)

      The suite came back with EXACTLY the same two failures as the unmutated
      baseline (both environment-dependent in the scratch copy:
      `TestSeal_GenerateReadSet_CitationsResolveToRealLines` and
      `TestSeal_Repair_NoFallbackToAnotherCheckoutsConfig`). NOT ONE SEAL
