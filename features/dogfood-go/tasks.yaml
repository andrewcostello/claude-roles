project: claude-workflow
epic: Dogfood — the four Go defects, in claude-workflow
# Machine-readable, and enforced by preflight. The capitalised header
# below was a comment, and on 2026-08-30 this file was dispatched against
# claude-dispatcher anyway. A run against the wrong repo now refuses at
# exit 2 before spending anything.
target_repo: claude-workflow

# This file LIVES IN THE REPO IT TARGETS, and that is load-bearing: the
# dispatcher derives the repo from the tasks file's own location
# (`detect_repo_root(tasks_path.parent)`), not from the working directory.
# It previously lived in claude-dispatcher with a capitalised comment
# telling the operator to point the run elsewhere, which is not something
# an operator CAN do — measured 2026-08-30, when it was dispatched against
# claude-dispatcher and two scaffolds built a mirror of this tree there.
#
# Every path below is in `claude-workflow` (/home/andrew/Project/claude-workflow),
# NOT in `claude-dispatcher`. The dispatcher runs against one repo at a time, so
# this file cannot be run in the same invocation as
# `features/dogfood-w2/tasks.yaml` and the operator must point the run at
# claude-workflow explicitly.
#
# Every unit is a defect RE-MEASURED while writing this file. DECISIONS.md was
# read as a map and every number was taken again; five figures in that log were
# wrong when first quoted and corrected later. FOUR of the figures below did not
# reproduce as recorded and the measured value is the one written here.
#
# ==========================================================================
# THE RULING THAT WAS SUPPOSED TO BLOCK THIS FILE — AND DOES NOT
# ==========================================================================
#
# The standing instruction was: the call-site reachability gate is ruled off on
# Go trees until (1) the host toolchain satisfies them — "37 of 38 go.mod files
# require >= 1.25, host is go1.24.4" — and (2) the second sweep stops costing a
# first (445 s x 2). Both preconditions were RE-DERIVED, and NEITHER holds for
# claude-workflow, because neither was ever measured against it:
#
#   (1) TOOLCHAIN. `find /home/andrew/Project/claude-workflow -name go.mod`
#       returns SEVEN files — cmd/{classify,deepseek,gates,iterate,recheck,
#       repro,reviewer} — and every one declares `go 1.21`. Host is go1.24.4.
#       ZERO of seven exceed the host. The precondition is already satisfied.
#
#       The "37 of 38" is `evenplay-mono`'s, not this repo's, and it does not
#       reproduce there either: measured 2026-08-12, evenplay-mono has 122
#       go.mod files, of which 119 require >= 1.25 (82 spell it `go 1.25.0`,
#       37 spell it `go 1.25`) and 3 declare `go 1.19`. The recorded "37" is
#       exactly the count of the second spelling, which is the likeliest source
#       of the error. The exposure is real and LARGER than recorded — it is
#       just not this repository's.
#
#   (2) COST. The 445 s is evenplay-mono's whole-tree sweep. Measured on THIS
#       tree at `feat/G2-adj @ 83b0b97`, extracted with `git archive` (45 MB),
#       `call_site_reachability.check_tree` over the whole repository:
#
#           5.8 s / 5.7 s / 5.7 s over three runs, MEDIAN 5.7 s
#           258 seals examined · 273 roots · 317 findings
#           13 unresolved calls · 68 unanalyzed paths · 3 subject gaps
#           OK 257 · BREACH 37 · REPORT 4 · ACCEPTED 0 · ABSTAIN 19
#
#       A delta run is two sweeps: ~11.4 s, not ~15 minutes. Two orders below
#       the figure the ruling turns on.
#
# SO: NO UNIT IN THIS FILE IS BLOCKED BY THE REACHABILITY RULING. It was a
# ruling about the PRIMARY TARGET (evenplay-mono) and it stands there unchanged;
# reading it as "off on Go trees" is a generalisation the measurements do not
# support, and this file is the measurement that says so.
#
# ==========================================================================
# WHAT IS ACTUALLY BLOCKED, PER UNIT
# ==========================================================================
#
#   GO-1  BLOCKED on a base-revision decision. Its subject exists only on
#         `fix/live-config-seal @ 0cfdb57`. Verified: `git merge-base
#         --is-ancestor 0cfdb57 1db2d41` is FALSE — the whole B1 lineage is
#         unmerged into `docs/explicit-state`. An operator must say which base
#         this unit builds on. NOT blocked by the reachability ruling.
#   GO-2  NOT BLOCKED. Applies to `docs/explicit-state @ 1db2d41` as it stands.
#   GO-3  NOT BLOCKED. Applies to `docs/explicit-state @ 1db2d41` as it stands,
#         and needs no gate of any kind: it is a schema and a key.
#   GO-4  BLOCKED on the same base-revision decision as GO-1, for the same
#         reason at a different revision: `feat/G2-adj @ 83b0b97`, also not an
#         ancestor of `1db2d41`. NOT blocked by the reachability ruling — the
#         opposite: the sweep that was supposed to be unaffordable is the
#         measurement this unit is built on.
#
# ORDER. The four units are independent and deliberately unchained: 4 waves,
# one role per wave. Mixed-role batches are legal at plan time today (DF-3 in
# wave 1), so a chain putting two roles at one depth would be the defect wave 1
# is fixing.
#
# ROLE CHAIN. scaffold -> seals -> bodies -> adjudicate, each blockedBy the
# previous. The protocol refuses a 'bodies' task that names no 'seals' task in
# blockedBy: "an absent edge is a refusal, never an empty unit that passes".
#
# FLOOR. `FLOOR_GLOBS` has 19 entries at `feat/D1-role-protocol` (re-counted
# after the known-red register merged; it was 17 at `6293f42`).
# Fifteen are `**/src/claude_dispatcher/**` paths that cannot match anything in
