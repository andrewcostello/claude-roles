      THE SUITE SIZE, RE-COUNTED: 97 `func Test` in `cmd/classify` — 70 across
      the six `*_seal_test.go` files (baseline 7, capability 10, contract 21,
      envgap 4, readset 19, repair 9) and 27 in `main_test.go`. The recorded
      "43 seals" was the count at the revision the panel read
      (`feat/B1-body @ 94d522a`, which measures 50 seal functions / 77 total);
      it does not reproduce at any revision measured. Use 97 and say when.

      THE SHAPE, which the panel stated better than a summary can: "the
      behaviour under review is the mapping (contract x -out x -json) ->
      artifact set + exit code, and that mapping is the part with no test."
      Every seal calls `EmitV1`/`EmitV2`/`WriteV2Sidecar`/`ParseContractVersion`
      as a LIBRARY, and nothing runs a binary built from this source —
      `pinnedBinary` is `./classify`, explicitly "a FIXTURE, not a build
      artifact: it must not be rebuilt".

      Contract must answer: what an end-to-end row is allowed to execute, given
      that the tracked `classify` binary is a pinned fixture that must NOT be
      rebuilt to satisfy a test; whether `registerContractVersionFlag` being
      unexecuted means nothing proves the real binary accepts
      `-contract-version` at all; and what the exit-code contract is for
      `run()`'s `ParseContractVersion -> printInvalidInput -> exit 3` path.

      DO NOT propose rebuilding the tracked binary to make a row pass. That is
      the differential baseline and its rebuild is a separate operator call.
    type: Task
    estimate: 2h
    labels: [size:M, area:go-tools]
    agent: claude
    role: scaffold
    status: To Do

  - key: GO-1-2
