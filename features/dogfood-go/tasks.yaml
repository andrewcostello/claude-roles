  # ---- GO-3  the schema does not describe the tool that writes it ---------
  - key: GO-3-1
    summary: scaffold — the run-state schema is falsified by the tool it documents
    description: |
      NOT BLOCKED. Applies to `docs/explicit-state @ 1db2d41` as it stands, and
      needs no gate of any kind: it is a schema and a key.

      MEASURED at `docs/explicit-state @ 1db2d41`.

      `config/run-state.schema.json:154` describes the `gates` object as
      "Written by cmd/gates". Its `propertyNames.enum` (lines 175-182) admits
      exactly THIRTEEN bare names:

          build, test, lint, complexity, coverage, gosec, staticcheck,
          semgrep, mutation, bench_relative, bench_absolute, differential,
          domain_suite

      `cmd/gates` writes gate keys through `mergeGates`
      (`cmd/gates/main.go:1325`, `state.Gates[r.Key] = r.Outcome`), and `r.Key`
      comes from `gateKey` (`cmd/gates/main.go:655-660`):

          func gateKey(p plan) gateID {
              if p.Module == nil { return gateID{Key: p.Gate} }
              return gateID{Key: p.Gate + ":" + p.Module.Rel, ModRel: p.Module.Rel}
          }

      Every module-scoped gate writes `<gate>:<module-rel-path>`. The enum
      contains no colon-bearing entry, so EVERY module-scoped key the tool
      writes is rejected by the schema that says the tool writes it. The
      module's own tests assert those literals — `cmd/gates/main_test.go` pins
      `test:apps/finance-domain/wallet` (659, 680), `test:m` (791),
      `test:apps/w` (834), `build:apps/w` (938), `coverage:apps/w` (939),
      `coverage:apps/finance-domain/wallet` (960). Six run-state keys the
      schema rejects, asserted as correct by the tool's own suite.

      THE RECORDED COUNT DID NOT REPRODUCE. `"additionalProperties": false`
      appears ELEVEN times in that file, not five — lines 9, 25, 44, 87, 99,
      135, 159, 191, 208, 247, 265 — and identically at `1db2d41`, `0cfdb57`,
      `83b0b97` and `12d845a`, so it is not a revision artifact. (Lines 156 and
      171 spell `additionalProperties` with a schema object rather than
      `false`, and do not count. Repo-wide the pattern matches 15 lines; the
      other four are model structured-output schemas in `cmd/recheck/main.go`
      and `cmd/reviewer/main.go` and are a different subject.)

      THE FINDING THAT MAKES THIS WORTH A UNIT, and it is not in the record:
      NOTHING VALIDATES AGAINST THE SCHEMA FILE. `validateRunState`
      (`cmd/gates/main.go:1269`) says in its own doc comment that it "enforces
      the invariants config/run-state.schema.json documents ... rather than
      reimplementing JSON Schema" — and it checks `schema_version`,
      `repo.worktree`, `classification.risk`, `classification.components`,
      gate `status` and the skipped/skip_reason pair. It NEVER checks a gate
      KEY against the enum. So the enum is unenforced prose that the tool
      contradicts, and the contradiction is invisible because the only reader
      is a human.

      One more measured fact the contract needs: gate NAMES come from a
      user-supplied `gates.json`, and no `gates.json` exists in this
      repository — `.agent/` holds only `risk-paths.json`, and the only
      instance is `cmd/gates/testdata/example-gates.json`, whose thirteen names
      are exactly the thirteen in the enum. So the bare-name half of the key
      space is only as conformant as whatever config a user supplies.

      Contract must answer: whether the enum is widened to admit the
      module-scoped form, replaced by a pattern, or struck as unenforceable;
      whether `validateRunState` becomes the enforcer or the schema does;
      and — the question the two answers hide — whether a hand-maintained enum
      beside a `gateKey()` function is a second table that will drift again.
      This repository has already named that class twice.
    type: Task
    estimate: 1h
    labels: [size:S, area:go-tools]
    agent: claude
    role: scaffold
    status: To Do

