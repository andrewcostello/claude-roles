tasks:

  # ---- GO-1  the integration layer is 0.0% covered ------------------------
  - key: GO-1-1
    summary: scaffold — the wiring that decides which contract is written is judged by nothing
    description: |
      BLOCKER, STATED FIRST: this unit's subject exists only on
