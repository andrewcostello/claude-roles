# These tools decide what gets reviewed in every consuming project, and nothing
# was checking them. This is that check.
#
# Tools and shared libraries have separate modules — there is no root go.mod — so every step
# runs with the module as its working directory. That is the same constraint
# cmd/gates enforces for consuming projects.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  study-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: install study YAML parser
        run: python -m pip install -r features/model-matrix/requirements.txt
      - name: study regression and isolation controls
        run: python -m unittest discover -s features/model-matrix -p 'test_*.py' -v
      - name: evaluation export and result-reader controls
        run: python -m unittest discover -s evals -p 'test_*.py' -v

  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cmd/classify, cmd/gates, cmd/iterate, cmd/recheck, cmd/repro, cmd/deepseek, cmd/reviewer, shared/statefile]
    steps:
      - uses: actions/checkout@v4
      # No cache-dependency-path: these modules are stdlib-only and have no
      # go.sum, and setup-go fails outright when pointed at a missing one.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat: $unformatted"
            gofmt -d .
            exit 1
          fi

      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: test
        working-directory: ${{ matrix.module }}
        run: go test -race -cover ./...

  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # A malformed rule table is a silent loss of classification: cmd/classify
      # exits INVALID_INPUT, and a caller that ignores the exit code proceeds
      # with an unclassified diff. Parse every table on every push.
      - name: rule tables and schema parse
        run: |
          status=0
          for f in cmd/classify/testdata/*.json \
                   cmd/gates/testdata/*.json \
                   config/run-state.schema.json \
                   .agent/risk-paths.json; do
            [ -f "$f" ] || continue
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::not valid JSON"
              status=1
            fi
          done
          exit $status

      # Valid JSON is not enough: a rule can name an unknown component, a
      # presentation rule can be marked financial, ids can collide. The
      # classifier rejects all of those at load, so run that validation here too
      # — it catches a bad table edited without touching any Go code.
      - name: rule tables are semantically valid
        working-directory: cmd/classify
        run: go test -run 'TestShippedConfigIsValid|TestParseConfig|TestLiveProjectConfig' ./...
